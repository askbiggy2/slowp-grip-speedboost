
name: Build Slowp QuestPatcher mod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out mod source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "platform-tools"

      - name: Set Android build paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Dobby hook library for Quest (ARM64)
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git third_party/Dobby

          cmake \
            -S third_party/Dobby \
            -B third_party/Dobby/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DDOBBY_GENERATE_SHARED=OFF \
            -DDOBBY_DEBUG=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build third_party/Dobby/build --config Release -j2

          DOBBY_LIB="$(find third_party/Dobby/build -type f -name 'libdobby.a' | head -n 1)"
          test -n "$DOBBY_LIB"
          echo "DOBBY_LIB=$DOBBY_LIB" >> "$GITHUB_ENV"

      - name: Build Slowp mod library
        run: |
          cmake \
            -S native \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DDOBBY_LIBRARY="$DOBBY_LIB" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release -j2

      - name: Package QuestPatcher QMOD
        run: |
          test -f qmod-template/mod.json
          test -f build/libSlowpGripSpeedBoost.so

          mkdir -p package
          cp qmod-template/mod.json package/mod.json
          cp build/libSlowpGripSpeedBoost.so package/

          cd package
          zip -9 ../SlowpGripSpeedBoost.qmod \
            mod.json libSlowpGripSpeedBoost.so

      - name: Upload QMOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlowpGripSpeedBoost-qmod
          path: SlowpGripSpeedBoost.qmod
          if-no-files-found: error
